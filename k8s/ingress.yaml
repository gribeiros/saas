apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-ingress
  labels:
    app: saas-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    - host: saas.seudominio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: saas-app-service
                port:
                  number: 8080

