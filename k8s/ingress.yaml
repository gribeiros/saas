apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  labels:
    app: saas-app
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-ingress-http
  labels:
    app: saas-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-to-https@kubernetescrd
spec:
  rules:
    - host: grs-tec.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: saas-app-service
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-ingress-https
  labels:
    app: saas-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - grs-tec.com
      secretName: saas-tls-secret
  rules:
    - host: grs-tec.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: saas-app-service
                port:
                  number: 8080
