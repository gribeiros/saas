name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Build, Test & Coverage Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 25 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Tests and JaCoCo Coverage Check (>= 90%)
        run: ./mvnw clean verify -B

      - name: Upload JaCoCo HTML Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Generate Workflow Summary
        if: always()
        run: |
          echo "## 🚀 CI Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version:** 25" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit & Integration Tests:** 100% Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **JaCoCo Coverage Enforcement:** Minimum 90% Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/site/jacoco/jacoco.csv ]; then
            echo "Relatório JaCoCo gerado com sucesso em target/site/jacoco/." >> $GITHUB_STEP_SUMMARY
          fi

  build-and-push:
    name: Build & Push Docker Image to Docker Hub
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/saas-app
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes on HostGator VPS
    needs: [ci, build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Copy Kubernetes Manifests to HostGator VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTGATOR_SSH_HOST }}
          username: ${{ secrets.HOSTGATOR_SSH_USER }}
          key: ${{ secrets.HOSTGATOR_SSH_KEY }}
          port: ${{ secrets.HOSTGATOR_SSH_PORT || 22 }}
          source: "k8s/"
          target: "${{ secrets.HOSTGATOR_APP_DIR || '/opt/saas' }}/"

      - name: Deploy to Kubernetes via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTGATOR_SSH_HOST }}
          username: ${{ secrets.HOSTGATOR_SSH_USER }}
          key: ${{ secrets.HOSTGATOR_SSH_KEY }}
          port: ${{ secrets.HOSTGATOR_SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.HOSTGATOR_APP_DIR || '/opt/saas' }}"
            NAMESPACE="${{ secrets.K8S_NAMESPACE || 'default' }}"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/saas-app:${{ github.sha }}"

            echo "Locating Kubernetes CLI..."
            if command -v kubectl >/dev/null 2>&1; then
              KUBE="kubectl"
            elif command -v k3s >/dev/null 2>&1; then
              KUBE="k3s kubectl"
            elif command -v microk8s >/dev/null 2>&1; then
              KUBE="microk8s kubectl"
            else
              echo "Error: Kubernetes CLI (kubectl, k3s, microk8s) not found on VPS!"
              exit 1
            fi

            echo "Using Kubernetes binary: $KUBE"
            echo "Deploying image: $IMAGE to namespace: $NAMESPACE"

            cd "$APP_DIR/k8s"

            $KUBE apply -f configmap.yaml -n "$NAMESPACE"
            $KUBE apply -f service.yaml -n "$NAMESPACE"

            sed -e "s|\${IMAGE_NAME}:\${IMAGE_TAG}|$IMAGE|g" deployment.yaml | $KUBE apply -n "$NAMESPACE" -f -

            echo "Awaiting rolling update completion..."
            $KUBE rollout status deployment/saas-app -n "$NAMESPACE" --timeout=180s

            echo "Kubernetes deployment completed successfully!"
            $KUBE get pods -l app=saas-app -n "$NAMESPACE"
