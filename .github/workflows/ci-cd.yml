name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Build, Test & Coverage Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 25 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Tests and JaCoCo Coverage Check (>= 90%)
        run: ./mvnw clean verify -B

      - name: Upload JaCoCo HTML Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Generate Workflow Summary
        if: always()
        run: |
          echo "## 🚀 CI Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version:** 25" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit & Integration Tests:** 100% Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **JaCoCo Coverage Enforcement:** Minimum 90% Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/site/jacoco/jacoco.csv ]; then
            echo "Relatório JaCoCo gerado com sucesso em target/site/jacoco/." >> $GITHUB_STEP_SUMMARY
          fi

  cd:
    name: Deploy to HostGator VPS
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to HostGator VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTGATOR_SSH_HOST }}
          username: ${{ secrets.HOSTGATOR_SSH_USER }}
          key: ${{ secrets.HOSTGATOR_SSH_KEY }}
          port: ${{ secrets.HOSTGATOR_SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.HOSTGATOR_APP_DIR || '/var/www/saas' }}"
            echo "Starting deploy in $APP_DIR on HostGator VPS..."

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ -d ".git" ]; then
              echo "Repository exists. Pulling latest commits from main..."
              git fetch origin main
              git reset --hard origin/main
            else
              echo "Cloning repository..."
              git clone "${{ github.server_url }}/${{ github.repository }}.git" .
              git checkout main
            fi

            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            export POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
            export POSTGRES_DB="${{ secrets.POSTGRES_DB }}"

            echo "Building and restarting services with Docker Compose..."
            docker compose down --remove-orphans || true
            docker compose up -d --build

            echo "Performing post-deploy health check..."
            sleep 10
            HEALTHY=false
            for i in $(seq 1 12); do
              if curl -s -f http://localhost:8080/v3/api-docs > /dev/null 2>&1; then
                echo "Application responded successfully on attempt $i!"
                HEALTHY=true
                break
              fi
              echo "Waiting for service availability (attempt $i/12)..."
              sleep 5
            done

            if [ "$HEALTHY" = false ]; then
              echo "Health check failed! Showing container logs:"
              docker compose logs --tail=50 app
              exit 1
            fi

            echo "Deployment to HostGator completed successfully!"
            docker compose ps

